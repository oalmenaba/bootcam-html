<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login With Bulma CSS</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0/css/all.min.css" integrity="sha512-3PN6gfRNZEX4YFyz+sIyTF6pGlQiryJu9NlGhu9LrLMQ7eDjNgudQoFDK3WSNAayeIKc6B8WXXpo4a7HqxjKwg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="is-size-3 has-text-centered mt-5 mb-5">
        Login with Bootstrap CSS
    </div>
    <section class="hero is-ligth isfullheight">
        <section class="hero-body">     
            <div class="container has-text-centered">
              <div class="is-size-3">
                Bienvenido
              </div>
            </div>
        </section>
    </section>

    <div class="has-text-centered">
        <div class="is-size-3">
            Bienvenido
        </div>
        <div class="column is-centered is-mobile mt-3 mb-4">   
            <div class="column is-narrow is-offset-one-quarter">              
                    <div class="field mt-3 mb-4 ">
                        <label class="label">Usuario</label>
                        <p class="control has-icons-left has-icons-right">
                          <input class="input" type="text" placeholder="Usuario">
                          <span class="icon is-small is-left">
                            <i class="fas fa-user"></i>
                          </span>
                          <span class="icon is-small is-right">
                            <i class="fas fa-check"></i>
                          </span>
                        </p>
                      </div>
                      <div class="field">
                        <label class="label">Contrase&ntilde;a</label>
                        <p class="control has-icons-left">
                          <input class="input" type="password" placeholder="Password">
                          <span class="icon is-small is-left">
                            <i class="fas fa-lock"></i>
                          </span>
                        </p>
                      </div>
                      <div class="field">
                        <p class="control">
                          <button class="button is-success">
                            Login
                          </button>
                        </p>
                      </div>
             
            </div>         
        </div>
    </div>

    
</body>
</html>
