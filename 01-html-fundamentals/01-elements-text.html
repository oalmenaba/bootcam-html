<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE= Edge,chrome=1">
    <title>Elementos de texto</title>
</head>

<body>
    <h1>Hola mundo h1</h1>
    <h2>Hola mundo h2</h2>
    <h3>Hola mundo h3</h3>
    <h4>Hola mundo h4</h4>
    <h5>Hola mundo h5</h5>
    <h6>Hola mundo h6</h6>

    <!-- ?elementos de bloque -->   
    <p id="parrafo">Hola mundoo soy un p&aacute;rrafo, &ntilde;</p>
    <p>Hola mundoo soy un p&Aacute;rrafo</p>
    <article>
        Hola soy un artículo
    </article>
    <aside>
        Hola soy aside
    </aside>
    <!-- ?elementos de linea -->
    <label for="parrafo">P&aacute;rrafo</label>
    <span>Span del <i>contentido</i> del articulo</span>
    <span>Span del <b>contentido</b> del articulo</span>
    <span>Span el  <a href="http://google.com" target="_blank"> articulo</a> </span>
</body>

</html>
